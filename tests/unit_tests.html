<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Unit Tests - Utilities</title>
  <style>body{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;padding:20px;} .pass{color:green;} .fail{color:red;}</style>
</head>
<body>
  <h1>Unit tests (utils)</h1>
  <div id="results"></div>
  <script src="../rendering/utils/colorUtils.js"></script>
  <script src="../data/MarkerUtilsCore.js"></script>
  <script src="../rendering/MarkerRenderer.js"></script>
  <script src="../data/routeMath.js"></script>
  <script>
    const results = document.getElementById('results');
    function assert(cond, msg) {
      const el = document.createElement('div');
      el.textContent = msg;
      el.className = cond ? 'pass' : 'fail';
      results.appendChild(el);
      if (!cond) console.error('FAILED:', msg);
    }

    // color utils
    try {
      const rgba = ColorUtils.hexToRgba('#22d3ee', 0.5);
      assert(typeof rgba === 'string' && rgba.startsWith('rgba('), 'ColorUtils.hexToRgba returns rgba string');
    } catch (e) { assert(false, 'ColorUtils.hexToRgba threw'); }

    // marker position (use MarkerUtilsCore)
    try {
      const fakeView = { zoom: 0.1, panX: 5, panY: 10 };
      const m = { x: 0.5, y: 0.25 };
      const pos = MarkerUtilsCore.getMarkerScreenPosition(m, fakeView, 8192);
      assert(pos && typeof pos.x === 'number' && typeof pos.y === 'number', 'MarkerUtilsCore.getMarkerScreenPosition returns coordinates');
    } catch (e) { assert(false, 'MarkerUtilsCore.getMarkerScreenPosition threw'); }

    // marker sizing helpers (use MarkerRenderer.computeMarkerSize)
    try {
      // Provide minimal globals used by MarkerRenderer
      window.LAYERS = window.LAYERS || {};
      const fakeMapState = { zoom: 1, panX: 0, panY: 0 };
      const fakeLayerState = { isLayerVisible: () => true };
      const fakeSelectionState = { selectedMarker: null, selectedMarkerLayer: null };
      const renderer = new MarkerRenderer(fakeMapState, fakeLayerState, fakeSelectionState, null, { MARKER_SCALING: { baseSize: 6, userScaleMultiplier: 1.0, highlightMultiplier: 2.0, selectionMultiplier: 1.3, zoomShrinkThreshold: 0.5, zoomShrinkRate: 0.75 }, TOUCH_PADDING: 4 }, LAYERS, null);
      renderer.init();
      const size = renderer.computeMarkerSize({ zoom: 1, baseSize: 6, isHighlighted: true, isSelected: false, userScaleMultiplier: 1.0, highlightMultiplier: 2.0 });
      assert(typeof size === 'number' && size > 0, 'MarkerRenderer.computeMarkerSize returns positive number');
      const hit = renderer.getMarkerHitRadius({ x: 0.5, y: 0.5, uid: 'm_test' }, 'customMarkers');
      assert(typeof hit === 'number' && hit >= size, 'MarkerRenderer.getMarkerHitRadius >= render size');
    } catch (e) { assert(false, 'MarkerRenderer sizing helpers threw'); }

    // route preview position
    try {
      const fakeMap = { zoom: 0.1, panX: 5, panY: 10 };
      const rp = { x: 0.2, y:0.4 };
      const pos = RouteMath.getRoutePreviewScreenPosition(rp, fakeMap);
      assert(pos && typeof pos.x === 'number' && typeof pos.y === 'number', 'RouteMath.getRoutePreviewScreenPosition returns coordinates');
    } catch (e) { assert(false, 'RouteMath.getRoutePreviewScreenPosition threw'); }
  </script>
</body>
</html>
